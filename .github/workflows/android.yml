
name: Build Collapse Frontier Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android build packages
        run: |
          sdkmanager "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Install Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false

      - name: Install Godot export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable
          wget -q \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz \
            -O /tmp/templates.tpz
          mkdir -p /tmp/godot-templates
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          cp -r /tmp/godot-templates/templates/. \
            ~/.local/share/godot/export_templates/4.3.stable/

      - name: Validate project
        run: |
          test -f project.godot
          test -f Main.tscn
          test -f export_presets.cfg
          godot --headless --editor --path . --quit

      - name: Check main scene
        run: |
          godot --headless --path . \
            --quit-after 5

      - name: Export Android APK
        run: |
          godot --headless --path . \
            --export-debug "Android" CollapseFrontier.apk
          test -s CollapseFrontier.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CollapseFrontier-APK
          path: CollapseFrontier.apk
          if-no-files-found: error
          retention-days: 7
          
